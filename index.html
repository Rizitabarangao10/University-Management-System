<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c1a40">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>National University - Management System</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body><i class="orb a"></i><i class="orb b"></i><i class="orb c"></i>
<main id="login" class="center"><form id="loginForm" class="glass card" data-mode="in">
<div class="logo-wrap"><img src="logo.png" alt="National University Logo" class="login-logo"></div>
<h1>University Management System</h1><p id="uni" class="sub">National University</p>
<p id="err" class="err" role="alert" hidden></p>
<p id="ok" class="ok" role="status" hidden></p>
<label id="nameF" hidden>Full name<input name="full_name" autocomplete="name"></label>
<label id="roleF" hidden>Account Type (Role)<select name="role">
<option value="student">Student</option>
<option value="teacher">Teacher</option>
</select></label>
<label id="emailF">Email<input name="email" type="email" required autocomplete="email"></label>
<label id="codeF" hidden>Verification code<input name="code" required inputmode="numeric" pattern="[0-9]{6,10}" maxlength="10" autocomplete="one-time-code" placeholder="Code from your email"></label>
<label id="passF"><span id="passL">Password</span><input name="password" type="password" required minlength="6" autocomplete="current-password"></label>
<button type="button" class="link forgot" id="forgot">Forgot password?</button>
<button class="btn wide" id="submit">Sign in</button>
<button type="button" class="link" id="toggle">Need an account? Sign up</button></form></main>
<div id="app" hidden><aside class="glass side"><div class="brand"><img src="logo.png" alt="National University Logo" class="side-logo"><div class="brand-text"><b>UMS</b><span id="uniS">National University</span></div><div class="live-status" title="Realtime sync active"><span class="live-dot" id="liveDot"></span><span class="live-text">Live</span></div><button type="button" class="nav-toggle-btn" id="navToggleBtn" aria-label="Toggle navigation menu" title="Menu"><svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2.2" fill="none"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button></div><div class="side-menu" id="sideMenu"><nav id="nav"></nav>
<div class="me">
<div class="user-profile-bar"><div class="avatar-box" id="sidebarAvatarBtn" title="Change profile picture (PNG only)"><img id="myAvatar" class="user-avatar" src="" alt="Avatar"><span class="avatar-badge">📷</span></div>
<div class="user-details"><span id="who"></span><span id="role" class="role-badge"></span></div></div>
<input type="file" id="avatarFileInput" accept="image/png,.png" hidden>
<button class="btn ghost wide" id="logout">Log out</button></div></div></aside><section id="main"></section></div>
<dialog id="dlg" class="glass"></dialog><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="app.js"></script></body></html>
